name: GPT Ops · direct-commit (stable)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task key (write_files | seed_zone)"
        required: true
      payload:
        description: "JSON payload string"
        required: true
  repository_dispatch:
    types: [gpt-task]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare inputs (normalize to file)
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          TASK=""
          PAYLOAD=""
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            TASK='${{ github.event.client_payload.task }}'
            echo '${{ toJson(github.event.client_payload.payload) }}' > payload.json
          else
            TASK='${{ inputs.task }}'
            printf '%s' '${{ inputs.payload }}' > payload.json
          fi
          echo "task=$TASK" >> $GITHUB_OUTPUT
          echo "Using default branch: ${DEFAULT_BRANCH}"
          jq . payload.json >/dev/null || { echo "Invalid JSON payload"; cat payload.json; exit 1; }

      - name: Run task
        id: task
        env:
          TASK: ${{ steps.prep.outputs.task }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs'); const path = require('path');
          const task = process.env.TASK;
          const payload = JSON.parse(fs.readFileSync('payload.json','utf8'));
          function ensureDir(p){ const d=path.dirname(p); if(!fs.existsSync(d)) fs.mkdirSync(d,{recursive:true}); }
          function writeFiles(){
            const files = payload.files || [];
            for(const f of files){
              ensureDir(f.path);
              const buf = Buffer.from(f.content_b64, 'base64');
              fs.writeFileSync(f.path, buf);
              console.log('WROTE', f.path);
            }
            fs.writeFileSync('.gpt-commit-message', payload.commit_message || 'chore(gpt): write files');
          }
          function seedZone(){
            const z = payload.zone || {};
            const zonesPath = 'master/atlases/zones.geojson';
            let fc = { type:'FeatureCollection', features:[] };
            try { fc = JSON.parse(fs.readFileSync(zonesPath,'utf8')); } catch {}
            ensureDir(zonesPath);
            const feat = {
              type:'Feature',
              properties:{ id:z.id, name:z.name, era:z.era||[], kind:z.kind||'zone' },
              geometry:{ type:'Polygon', coordinates:[ z.polygon || [[0,0],[1,0],[1,1],[0,1],[0,0]] ] }
            };
            fc.features = (fc.features||[]).filter(f => f?.properties?.id !== z.id);
            fc.features.push(feat);
            fs.writeFileSync(zonesPath, JSON.stringify(fc,null,2));
            console.log('SEEDED', z.id, '->', zonesPath);
            fs.writeFileSync('.gpt-commit-message', payload.commit_message || `feat(atlas): seed ${z.id}`);
          }
          if(task==='write_files') writeFiles();
          else if(task==='seed_zone') seedZone();
          else { console.error('Unknown task:', task); process.exit(2); }
          JS

      - name: Commit & Push (auto default branch)
        shell: bash
        run: |
          set -e
          msg=$(cat .gpt-commit-message 2>/dev/null || echo "chore(gpt): update")
          git config user.name "gpt-bot"
          git config user.email "gpt-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "$msg"
          git push origin HEAD:${DEFAULT_BRANCH}

      - name: Done
        run: echo "✅ Done: ${{ steps.prep.outputs.task }}"

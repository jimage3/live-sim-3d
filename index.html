<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kranker · Live Sim (Lite)</title>
<link rel="stylesheet" href="./assets/app.css">
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<body>
<div class="toolbar">
  <div class="brand"><b>kranker</b> · live-sim-3d</div><div class="spacer"></div>
  <input id="base" placeholder="Artifacts Base URL">
  <button id="load">Load</button>
</div>
<canvas id="viewport"></canvas>
<script>
const $=s=>document.querySelector(s); $('#base').value='https://jimage3.github.io/canon-core';
let r,s,c,ctl;
function init(){r=new THREE.WebGLRenderer({canvas:$('#viewport'),antialias:true});resize();
s=new THREE.Scene(); s.background=new THREE.Color(0x0c0c0c);
c=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1e5); c.position.set(120,120,120);
ctl=new THREE.OrbitControls(c,$('#viewport')); s.add(new THREE.DirectionalLight(0xffffff,1).position.set(100,200,100)); s.add(new THREE.AmbientLight(0x777777));
(function loop(){requestAnimationFrame(loop); ctl.update(); r.render(s,c)})()}
function resize(){r?.setSize(innerWidth,innerHeight); if(c){c.aspect=innerWidth/innerHeight; c.updateProjectionMatrix()}}
addEventListener('resize',resize);
async function load(){
  const base=$('#base').value.replace(/\/$/,''); const url=`${base}/master/atlases/zones.geojson`;
  const fc=await fetch(url).then(x=>x.json()); const mat=new THREE.MeshPhongMaterial({color:0x5566ff,transparent:true,opacity:.65});
  (fc.features||[]).forEach(f=>{ if(f.geometry?.type!=='Polygon') return;
    const pts=f.geometry.coordinates[0].map(([x,y])=>new THREE.Vector2(x,y)); const sh=new THREE.Shape();
    sh.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) sh.lineTo(pts[i].x,pts[i].y);
    const geo=new THREE.ExtrudeGeometry(sh,{depth:2,bevelEnabled:false}); const m=new THREE.Mesh(geo,mat); m.position.z=-1; s.add(m);
  });
}
$('#load').addEventListener('click',load); init();
</script>
</body></html>
